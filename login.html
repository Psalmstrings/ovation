<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login — OVATION MUSIC HOUSE</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.08) 0%, var(--color-navy-dark) 70%);
      position: relative;
      overflow: hidden;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 175, 55, 0.1);
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 2;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo .logo-icon {
      margin: 0 auto 1rem auto;
      width: 54px;
      height: 54px;
      font-size: 1.8rem;
    }

    .login-title {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-text-white);
      margin-bottom: 0.5rem;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--color-text-subtle);
    }

    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-gold-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .form-control {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: var(--radius-sm);
      color: var(--color-text-white);
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--color-gold-primary);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
      background: rgba(30, 41, 59, 1);
    }

    .login-btn {
      width: 100%;
      margin-top: 1rem;
      padding: 0.9rem;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .error-alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #EF4444;
      color: #FCA5A5;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }

    .demo-credentials-box {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(212, 175, 55, 0.05);
      border: 1px dashed rgba(212, 175, 55, 0.3);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      color: var(--color-text-subtle);
      text-align: center;
    }

    .demo-credentials-box code {
      color: var(--color-gold-primary);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <!-- Soundwave Canvas background element -->
    <canvas id="heroCanvas" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.4;"></canvas>

    <div class="login-card reveal-fade-up">
      <div class="login-logo">
        <a href="index.html" class="brand-logo" style="justify-content: center;">
          <div class="logo-icon">O</div>
        </a>
        <h1 class="login-title">OVATION <span class="text-gold">ADMIN</span></h1>
        <p class="login-subtitle">Sign in to manage customer enquiries & sound requests</p>
      </div>

      <div class="error-alert" id="errorAlert"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminEmail">Email Address</label>
          <input type="email" id="adminEmail" class="form-control" placeholder="admin@ovationmusic.com" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="adminPassword">Security Password</label>
          <input type="password" id="adminPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-gold login-btn" id="loginBtn">
          <span>🔐 Secure Admin Sign In</span>
        </button>
      </form>

      <div class="demo-credentials-box">
        <div><strong>Default Admin Passcode:</strong></div>
        <div style="margin-top: 0.25rem;">Email: <code>admin@ovationmusic.com</code></div>
        <div>Password: <code>ovation2026</code></div>
        <button type="button" id="fillDemoBtn" class="btn btn-outline-gold btn-sm" style="margin-top: 0.75rem; padding: 0.25rem 0.75rem; font-size: 0.75rem;">
          ⚡ Auto-Fill Credentials
        </button>
      </div>

      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="index.html" style="color: var(--color-text-subtle); font-size: 0.85rem; text-decoration: none;">← Return to Main Website</a>
      </div>
    </div>
  </div>

  <script src="js/firebase.js"></script>
  <script src="js/animations.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to admin
      if (window.OvationDB.getAdminSession()) {
        window.location.href = 'admin.html';
        return;
      }

      const loginForm = document.getElementById('adminLoginForm');
      const errorAlert = document.getElementById('errorAlert');
      const loginBtn = document.getElementById('loginBtn');
      const fillDemoBtn = document.getElementById('fillDemoBtn');

      fillDemoBtn.addEventListener('click', () => {
        document.getElementById('adminEmail').value = 'admin@ovationmusic.com';
        document.getElementById('adminPassword').value = 'ovation2026';
      });

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorAlert.style.display = 'none';
        
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value.trim();

        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span>Authenticating...</span>';

        const result = await window.OvationDB.loginAdmin(email, password);

        if (result.success) {
          loginBtn.innerHTML = '<span>✅ Access Granted! Redirecting...</span>';
          setTimeout(() => {
            window.location.href = 'admin.html';
          }, 600);
        } else {
          errorAlert.innerText = result.error || 'Authentication failed. Please check your credentials.';
          errorAlert.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<span>🔐 Secure Admin Sign In</span>';
        }
      });
    });
  </script>
</body>
</html>
