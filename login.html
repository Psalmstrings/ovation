<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In — OVATION MUSIC HOUSE</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;

      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(212, 175, 55, 0.08) 0%,
          var(--color-navy-dark) 75%
        );

      position: relative;
      overflow: hidden;
    }

    .login-card {
      width: 100%;
      max-width: 450px;

      background: rgba(15, 23, 42, 0.88);

      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: var(--radius-lg);

      padding: 2.5rem 2.25rem;

      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.6),
        0 0 35px rgba(212, 175, 55, 0.12);

      backdrop-filter: blur(16px);

      position: relative;
      z-index: 2;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .login-logo .logo-icon {
      margin: 0 auto 0.75rem auto;
      width: 54px;
      height: 54px;
      font-size: 1.8rem;
    }

    .login-title {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-text-white);
      margin-bottom: 0.35rem;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--color-text-subtle);
    }

    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }

    .form-group label {
      display: block;

      font-size: 0.78rem;
      font-weight: 600;

      color: var(--color-gold-primary);

      text-transform: uppercase;
      letter-spacing: 1px;

      margin-bottom: 0.4rem;
    }

    .form-control {
      width: 100%;

      padding: 0.85rem 1.1rem;

      background: rgba(30, 41, 59, 0.8);

      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: var(--radius-sm);

      color: var(--color-text-white);

      font-size: 0.95rem;

      transition: all 0.3s ease;

      box-sizing: border-box;
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .form-control:focus {
      outline: none;

      border-color: var(--color-gold-primary);

      box-shadow:
        0 0 12px rgba(212, 175, 55, 0.25);

      background: rgba(30, 41, 59, 1);
    }

    .login-btn {
      width: 100%;

      margin-top: 1rem;

      padding: 0.9rem;

      font-size: 0.95rem;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 0.5rem;

      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .alert-box {
      padding: 0.75rem 1rem;

      border-radius: var(--radius-sm);

      font-size: 0.85rem;

      margin-bottom: 1.25rem;

      display: none;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);

      border: 1px solid #EF4444;

      color: #FCA5A5;
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.15);

      border: 1px solid #22C55E;

      color: #86EFAC;
    }

    .signup-link-box {
      margin-top: 1.5rem;

      text-align: center;

      font-size: 0.88rem;

      color: var(--color-text-subtle);

      border-top: 1px solid rgba(255, 255, 255, 0.08);

      padding-top: 1.25rem;
    }

    .signup-link-box a {
      color: var(--color-gold-primary);

      font-weight: 600;

      text-decoration: none;

      margin-left: 0.35rem;
    }

    .signup-link-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <!-- Animated background -->
    <canvas
      id="heroCanvas"
      style="
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0.4;
      "
    ></canvas>

    <div class="login-card reveal-fade-up">

      <!-- Logo -->
      <div class="login-logo">

        <a
          href="index.html"
          class="brand-logo"
          style="justify-content: center;"
        >
          <div class="logo-icon">O</div>
        </a>

        <h1 class="login-title">
          ADMIN <span class="text-gold">SIGN IN</span>
        </h1>

        <p class="login-subtitle">
          Control portal
        </p>

      </div>

      <!-- Error message -->
      <div
        class="alert-box alert-error"
        id="errorAlert"
        role="alert"
      ></div>

      <!-- Success message -->
      <div
        class="alert-box alert-success"
        id="successAlert"
        role="status"
      ></div>

      <!-- Login form -->
      <form id="adminLoginForm" novalidate>

        <div class="form-group">

          <label for="adminEmail">
            Email Address
          </label>

          <input
            type="email"
            id="adminEmail"
            class="form-control"
            placeholder="admin@ovationmusichouse.com"
            required
            autocomplete="username"
          >

        </div>

        <div class="form-group">

          <label for="adminPassword">
            Security Password
          </label>

          <input
            type="password"
            id="adminPassword"
            class="form-control"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >

        </div>

        <button
          type="submit"
          class="btn btn-gold login-btn"
          id="loginBtn"
        >
          <span>🔐 Sign In</span>
        </button>

      </form>

      <!-- Return to website -->
      <div
        style="
          text-align: center;
          margin-top: 1.25rem;
        "
      >
        <a
          href="index.html"
          style="
            color: var(--color-text-subtle);
            font-size: 0.85rem;
            text-decoration: none;
          "
        >
          ← Return to Main Website
        </a>
      </div>

    </div>
  </div>


  <!-- Firebase / Database -->
  <script src="js/firebase.js"></script>

  <!-- Animations -->
  <script src="js/animations.js"></script>


  <script>

    document.addEventListener('DOMContentLoaded', function () {

      /*
       * ============================================================
       * ELEMENTS
       * ============================================================
       */

      const loginForm =
        document.getElementById('adminLoginForm');

      const emailInput =
        document.getElementById('adminEmail');

      const passwordInput =
        document.getElementById('adminPassword');

      const errorAlert =
        document.getElementById('errorAlert');

      const successAlert =
        document.getElementById('successAlert');

      const loginBtn =
        document.getElementById('loginBtn');


      /*
       * ============================================================
       * BASIC ELEMENT CHECK
       * ============================================================
       */

      if (!loginForm || !emailInput || !passwordInput || !loginBtn) {

        console.error(
          'Login page: Required login elements are missing.'
        );

        return;
      }


      /*
       * ============================================================
       * CHECK DATABASE OBJECT
       * ============================================================
       */

      if (!window.OvationDB) {

        showError(
          'Database system could not be loaded. Please refresh the page or contact the administrator.'
        );

        console.error(
          'window.OvationDB is undefined. Check js/firebase.js'
        );

        return;
      }


      /*
       * ============================================================
       * CHECK EXISTING SESSION
       * ============================================================
       */

      try {

        if (
          typeof window.OvationDB.getAdminSession === 'function'
        ) {

          const existingSession =
            window.OvationDB.getAdminSession();

          if (existingSession) {

            window.location.replace('admin.html');

            return;
          }
        }

      } catch (error) {

        console.error(
          'Session check failed:',
          error
        );
      }


      /*
       * ============================================================
       * SHOW ERROR
       * ============================================================
       */

      function showError(message) {

        successAlert.style.display = 'none';

        errorAlert.textContent = message;

        errorAlert.style.display = 'block';
      }


      /*
       * ============================================================
       * SHOW SUCCESS
       * ============================================================
       */

      function showSuccess(message) {

        errorAlert.style.display = 'none';

        successAlert.innerHTML = message;

        successAlert.style.display = 'block';
      }


      /*
       * ============================================================
       * HIDE ALERTS
       * ============================================================
       */

      function clearAlerts() {

        errorAlert.style.display = 'none';

        successAlert.style.display = 'none';

        errorAlert.textContent = '';

        successAlert.textContent = '';
      }


      /*
       * ============================================================
       * LOGIN
       * ============================================================
       */

      loginForm.addEventListener(
        'submit',
        async function (event) {

          event.preventDefault();

          clearAlerts();


          /*
           * Get values
           */

          const email =
            emailInput.value.trim();

          const password =
            passwordInput.value;


          /*
           * Validate email
           */

          if (!email) {

            showError(
              'Please enter your email address.'
            );

            emailInput.focus();

            return;
          }


          /*
           * Validate password
           */

          if (!password) {

            showError(
              'Please enter your password.'
            );

            passwordInput.focus();

            return;
          }


          /*
           * Disable login button
           */

          loginBtn.disabled = true;

          loginBtn.innerHTML =
            '<span>⏳ Authenticating...</span>';


          try {

            /*
             * Make sure loginUser exists
             */

            if (
              typeof window.OvationDB.loginUser !== 'function'
            ) {

              throw new Error(
                'The login service is not available. Check js/firebase.js.'
              );
            }


            /*
             * Authenticate user
             */

            const result =
              await window.OvationDB.loginUser(
                email,
                password
              );


            /*
             * Login failed
             */

            if (
              !result ||
              result.success !== true
            ) {

              showError(
                result?.error ||
                'Authentication failed. Please check your email and password.'
              );

              loginBtn.disabled = false;

              loginBtn.innerHTML =
                '<span>🔐 Sign In</span>';

              return;
            }


            /*
             * Get authenticated user
             */

            const user =
              result.user || {};


            /*
             * Get safe display information
             */

            const fullName =
              user.fullName ||
              user.name ||
              'Administrator';

            const role =
              user.role ||
              'Admin';


            /*
             * Show success
             */

            showSuccess(
              '<strong>Welcome Back, ' +
              escapeHtml(fullName) +
              '!</strong><br>' +
              'Role: ' +
              escapeHtml(role) +
              ' | Login successful. Redirecting...'
            );


            /*
             * Redirect
             */

            setTimeout(function () {

              window.location.replace(
                'admin.html'
              );

            }, 800);


          } catch (error) {

            console.error(
              'Login error:',
              error
            );


            /*
             * Convert Firebase errors into
             * user-friendly messages
             */

            let message =
              'Unable to sign in. Please try again.';


            if (error && error.message) {

              message =
                getFriendlyFirebaseError(
                  error
                );
            }


            showError(message);


            /*
             * Re-enable button
             */

            loginBtn.disabled = false;

            loginBtn.innerHTML =
              '<span>🔐 Sign In</span>';
          }

        }
      );


      /*
       * ============================================================
       * FIREBASE ERROR HANDLER
       * ============================================================
       */

      function getFriendlyFirebaseError(error) {

        const message =
          String(error.message || '')
            .toLowerCase();


        if (
          message.includes('invalid-credential') ||
          message.includes('invalid login credentials')
        ) {

          return 'Invalid email or password.';
        }


        if (
          message.includes('user-not-found')
        ) {

          return 'No account was found with this email address.';
        }


        if (
          message.includes('wrong-password')
        ) {

          return 'Incorrect password.';
        }


        if (
          message.includes('invalid-email')
        ) {

          return 'Please enter a valid email address.';
        }


        if (
          message.includes('too-many-requests')
        ) {

          return 'Too many login attempts. Please wait a moment and try again.';
        }


        if (
          message.includes('network-request-failed')
        ) {

          return 'Network error. Please check your internet connection.';
        }


        if (
          message.includes('permission-denied')
        ) {

          return 'You do not have permission to access the admin portal.';
        }


        /*
         * Don't expose overly technical errors
         * to normal users.
         */

        return error.message ||
          'Authentication failed. Please check your credentials.';
      }


      /*
       * ============================================================
       * HTML ESCAPE
       * ============================================================
       */

      function escapeHtml(value) {

        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

    });

  </script>

</body>
</html>
